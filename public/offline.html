<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posty · Sin conexión</title>
<meta name="theme-color" content="#2793C8">
<style>
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#F2F9FD;color:#0A1E33;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{max-width:400px;width:100%;background:#fff;border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 10px 40px rgba(10,30,51,.10)}
  h1{font-size:21px;margin:16px 0 8px}
  p{font-size:15px;line-height:1.55;color:#47617A;margin:0 0 22px}
  button{background:#FEC14D;color:#0A1E33;font-weight:800;font-size:15px;padding:13px 30px;border:0;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Posty" width="72" height="72" style="border-radius:50%">
    <h1>Uy, no hay conexión 😅</h1>
    <p>Posty necesita internet para mostrarte tu semana. Revisá tu conexión y probá de nuevo — tu cuenta y tus posteos están a salvo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
